[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "aphantasia-pipelines"
version = "0.1.0"
description = "Auditable secondary-data preparation and analysis for four aphantasia projects"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
plots = ["matplotlib>=3.8,<4"]
spss = ["pyreadstat>=1.2,<2"]

[project.scripts]
aphantasia = "aphantasia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
